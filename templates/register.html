{% extends "base.html" %}
{% block title %}Create your profile — SkillMatch{% endblock %}
{% block content %}
<div class="auth-box" style="max-width:600px;">
    <h2>Create your profile</h2>
    <form method="POST">
        <div class="form-row">
            <div class="form-group"><label>Full Name *</label><input type="text" name="name" value="{{ form_data.get('name','') }}" required></div>
            <div class="form-group"><label>Email *</label><input type="email" name="email" value="{{ form_data.get('email','') }}" required></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Phone</label><input type="text" name="phone" value="{{ form_data.get('phone','') }}"></div>
            <div class="form-group"><label>Location</label><input type="text" name="location" value="{{ form_data.get('location','') }}"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Password *</label><input type="password" name="password" required></div>
            <div class="form-group"><label>Confirm Password *</label><input type="password" name="confirm_password" required></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>College</label><input type="text" name="college" value="{{ form_data.get('college','') }}"></div>
            <div class="form-group"><label>Course</label><input type="text" name="course" value="{{ form_data.get('course','') }}"></div>
        </div>
        <div class="form-group"><label>Graduation Year</label><input type="number" name="graduation_year" value="{{ form_data.get('graduation_year','') }}"></div>
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>
    <p style="text-align:center; margin-top:16px; color:var(--text-dim);">
        Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a>
    </p>
</div>
{% endblock %}
