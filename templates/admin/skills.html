{% extends "base.html" %}
{% block title %}Manage Skills — SkillMatch{% endblock %}
{% block content %}
<div class="dash-layout">
    {% include 'partials/admin_sidebar.html' %}
    <div class="main-content">
        <h2>Manage Skills</h2>
        <div class="card" style="margin-bottom:20px;">
            <form method="POST" style="display:flex; gap:10px;">
                <input type="text" name="skill_name" placeholder="e.g. Kubernetes" required>
                <button type="submit" class="btn btn-primary">Add Skill</button>
            </form>
        </div>
        <div class="card">
            <table>
                <thead><tr><th>Skill</th><th></th></tr></thead>
                <tbody>
                {% for s in skills %}
                    <tr>
                        <td>{{ s.skill_name }}</td>
                        <td>
                            <form method="POST" action="{{ url_for('admin.delete_skill', skill_id=s.id) }}" onsubmit="return confirm('Delete this skill?');">
                                <button class="btn btn-sm btn-danger">Delete</button>
                            </form>
                        </td>
                    </tr>
                {% else %}
                    <tr><td colspan="2" style="color:var(--text-dim);">No skills yet.</td></tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
